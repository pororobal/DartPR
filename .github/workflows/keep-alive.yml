name: Keep Render alive

on:
  schedule:
    # 10분마다 ping (Render free tier: 15분 inactivity → sleep)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: curl -sS --max-time 10 https://dartpr.onrender.com/api/v1/auth/me > /dev/null
